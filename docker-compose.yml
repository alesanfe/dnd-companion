services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DND_CONTENT_DB=/data/content.sqlite3
      - DND_STATE_DB=/data/state.sqlite3
      # orígenes extra para CORS (solo si el front se sirve desde
      # otro dominio/puerto; el proxy nginx del front es same-origin)
      - DND_CORS_ORIGINS=${DND_CORS_ORIGINS:-http://localhost:5173}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
