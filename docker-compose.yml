services:
  backend:
    build: ./backend
    # solo la red interna de compose lo alcanza — publicar 8000 en el
    # host bypaseaba el proxy nginx (headers/rate-limit futuros)
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      - DND_CONTENT_DB=/data/content.sqlite3
      - DND_STATE_DB=/data/state.sqlite3
      # orígenes extra para CORS (solo si el front se sirve desde
      # otro dominio/puerto; el proxy nginx del front es same-origin)
      - DND_CORS_ORIGINS=${DND_CORS_ORIGINS:-http://localhost:5173}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
