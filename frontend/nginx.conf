# nginx del frontend — sirve la SPA y proxifica API + WebSocket al
# backend (el compose monta `backend` en la red interna).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API REST → backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de salas de campaña — necesita Upgrade/Connection
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # sesiones largas: no cortar el socket a los 60s de nginx
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — rutas cliente → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
