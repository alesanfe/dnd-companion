name: CI - Seguridad (secretos + dependencias)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '29 4 * * 1'

jobs:
  secrets:
    name: 'Escaneo de secretos (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Binario OSS fijado — gitleaks-action@v2 exige licencia de pago.
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Escanear secretos
        run: ./gitleaks git --verbose --redact .

  pip-audit:
    name: 'Auditoría dependencias Python (backend + pipeline)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -U pip setuptools virtualenv pip-audit
      - run: pip install -e backend -e data-pipeline && pip-audit --local --skip-editable

  npm-audit:
    name: 'Auditoría dependencias npm (frontend)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  # Solo en PR: bloquea diffs de dependencias que introducen CVEs.
  dependency-review:
    name: 'Revisión de dependencias (PR)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
