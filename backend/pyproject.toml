[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-companion-backend"
version = "0.1.0"
description = "D&D Companion backend — FastAPI + effects engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pywebpush>=2.0",   # Web Push PWA (roll-request con app cerrada)
    # Pisos de seguridad sobre transitivas (pip-audit en CI):
    "pyjwt>=2.15.0",    # PYSEC-2026-414x — vía pywebpush
    "urllib3>=2.8.0",   # PYSEC-2026-417x — vía requests/pywebpush
    "tornado>=6.5.9",   # GHSA-chx6-46f5-w4vp y otras
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]
