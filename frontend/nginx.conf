# nginx del frontend — sirve la SPA y proxifica API + WebSocket al
# backend (el compose monta `backend` en la red interna).

# Rate-limit de auth: login/register son los únicos endpoints con
# secreto — 5 req/min por IP frena fuerza bruta sin molestar uso real
# (el backend además tiene su propio throttle persistente)
limit_req_zone $binary_remote_addr zone=dnd_auth:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # la SPA sube exportaciones JSON de campaña — pequeñas, pero no 1MB
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1k;

    # assets con hash de Vite: inmutables, caché larga
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # auth: el throttle más duro va aquí — antes de llegar al backend
    location /api/auth/ {
        limit_req zone=dnd_auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST → backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de salas de campaña — necesita Upgrade/Connection
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # sesiones largas: no cortar el socket a los 60s de nginx
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — rutas cliente → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
